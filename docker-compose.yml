services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: krayin-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - krayin-network

  webserver:
    image: nginx:alpine
    container_name: krayin-webserver
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - krayin-network

  db:
    image: mysql:8.0
    container_name: krayin-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: laravel-crm
      MYSQL_USER: krayin
      MYSQL_PASSWORD: 123456
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - krayin-db-data:/var/lib/mysql
    networks:
      - krayin-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: krayin-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - krayin-network

volumes:
  krayin-db-data:
    driver: local

networks:
  krayin-network:
    driver: bridge
